<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goji Health — Front Desk</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --border: #e3ddd2;
      --ink: #1f1d1a;
      --ink-soft: #6b6760;
      --ink-muted: #9a958c;
      --goji: #c44a3a;
      --goji-soft: #f2d8d2;
      --good: #2d8a4f;
      --warn: #c98a14;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      /* Retention tiers */
      --tier-green:  #2d8a4f;
      --tier-yellow: #caa11d;
      --tier-orange: #d4831f;
      --tier-red:    #c0392b;
      --tier-green-bg:  #e6f3ec;
      --tier-yellow-bg: #fbf1cf;
      --tier-orange-bg: #fbe6cf;
      --tier-red-bg:    #f7dcd7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 32px 64px; }

    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 20px; border-bottom: 1px solid var(--border);
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-img { height: 44px; width: auto; flex-shrink: 0; background: transparent; }
    .brand-name { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .brand-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
    .updated { font-size: 12px; color: var(--ink-muted); }
    .updated .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--good); margin-right: 6px; vertical-align: middle;
    }

    /* Summary tier cards — the coloured "status bar" across the top. */
    .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
      cursor: pointer; transition: transform 0.05s, box-shadow 0.12s;
    }
    .kpi-card:hover { transform: translateY(-1px); }
    .kpi-card.active { box-shadow: 0 0 0 2px var(--ink); }
    .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
    .kpi-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

    /* "Needs follow-up" headline card */
    .kpi-card[data-tier=all] { border-left: 4px solid var(--goji); }
    /* Solid-coloured tier cards */
    .kpi-card[data-tier=red], .kpi-card[data-tier=orange], .kpi-card[data-tier=yellow] { border: none; }
    .kpi-card[data-tier=red]    { background: var(--tier-red);    color: #fff; }
    .kpi-card[data-tier=orange] { background: var(--tier-orange); color: #fff; }
    .kpi-card[data-tier=yellow] { background: var(--tier-yellow); color: #3d3107; }
    .kpi-card[data-tier=red] .kpi-label,    .kpi-card[data-tier=red] .kpi-sub,
    .kpi-card[data-tier=orange] .kpi-label, .kpi-card[data-tier=orange] .kpi-sub { color: rgba(255,255,255,0.88); }
    .kpi-card[data-tier=yellow] .kpi-label, .kpi-card[data-tier=yellow] .kpi-sub { color: rgba(61,49,7,0.78); }
    /* Context cards */
    .kpi-card[data-tier=green]  { background: var(--tier-green-bg); border-color: #cfe6d8; }
    .kpi-card[data-tier=green] .kpi-value { color: var(--tier-green); }
    .kpi-card[data-tier=booked] { border-left: 4px solid var(--good); cursor: default; }
    .kpi-card[data-tier=booked]:hover { transform: none; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 16px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
      color: var(--ink-soft); background: none; border: none; border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); border-bottom-color: var(--goji); }
    .tab .count {
      display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px;
      font-size: 11px; line-height: 17px; border-radius: 999px;
      background: var(--border); color: var(--ink-soft); text-align: center;
    }
    .tab.active .count { background: var(--goji-soft); color: var(--goji); }

    section.q {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow);
    }
    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar h2 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
    .toolbar label { font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
    select, .toolbar input {
      font: inherit; font-size: 13px; padding: 5px 10px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--ink);
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-weight: 500; color: var(--ink-soft);
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    td { padding: 10px 12px; border-bottom: 1px solid #f0ebe2; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .name { font-weight: 600; }
    a.phone { color: var(--goji); text-decoration: none; font-variant-numeric: tabular-nums; }
    a.phone:hover { text-decoration: underline; }
    .muted { color: var(--ink-muted); }
    .note { font-size: 12px; color: var(--ink-muted); font-style: italic; margin-top: 3px; }

    .tier-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 2px 9px; border-radius: 999px; text-transform: capitalize;
    }
    .tier-badge.green  { background: var(--tier-green-bg);  color: var(--tier-green); }
    .tier-badge.yellow { background: var(--tier-yellow-bg); color: #8a6d10; }
    .tier-badge.orange { background: var(--tier-orange-bg); color: #a85c10; }
    .tier-badge.red    { background: var(--tier-red-bg);    color: var(--tier-red); }

    .status-pill {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 1px 8px; border-radius: 4px;
      background: var(--goji-soft); color: var(--goji); text-transform: capitalize;
    }
    .pill-booked { background: #e3f2e8; color: var(--good); }

    .actions { display: flex; gap: 6px; justify-content: flex-end; }
    .actions button {
      font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--ink-soft);
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .actions button:hover { background: var(--bg); color: var(--ink); }
    .actions button.primary { border-color: var(--good); color: var(--good); }
    .actions button.primary:hover { background: var(--good); color: #fff; }
    .actions button.danger:hover { background: var(--goji); color: #fff; border-color: var(--goji); }

    .empty { text-align: center; color: var(--ink-muted); padding: 40px 0; }
    .pii-note { font-size: 12px; color: var(--ink-muted); margin-top: 14px; }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(252,249,242,0.96);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      transition: opacity 0.2s ease-out;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-card { text-align: center; }
    .loading-spinner {
      width: 36px; height: 36px; margin: 0 auto 14px;
      border: 3px solid var(--border); border-top-color: var(--goji);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-hint.error { color: var(--goji); }

    @media (max-width: 820px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
      .wrap { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading patient worklist…</div>
      <div class="loading-hint" id="loadingHint"></div>
    </div>
  </div>

  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img class="brand-img" src="/static/soily.webp" alt="Goji Health">
        <div>
          <div class="brand-name">Front Desk</div>
          <div class="brand-sub">Patient retention &amp; follow-up</div>
        </div>
      </div>
      <div class="updated" id="updated"></div>
    </header>

    <div class="kpi-row" id="summary"></div>

    <div class="tabs">
      <button class="tab active" id="tab-worklist" onclick="setView('worklist')">Follow-up worklist</button>
      <button class="tab" id="tab-dismissed" onclick="setView('dismissed')">Dismissed <span class="count" id="dismissedCount">0</span></button>
    </div>

    <section class="q">
      <div class="toolbar">
        <h2 id="listTitle">Follow-up worklist</h2>
        <div id="worklistControls" style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
          <label>Clinician
            <select id="clinicianFilter"><option value="">All</option></select>
          </label>
          <label><input type="checkbox" id="showAll"> Show booked &amp; healthy</label>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Patient</th>
            <th>Phone</th>
            <th>Clinician</th>
            <th class="num">Last seen</th>
            <th class="num">Days ago</th>
            <th>Status</th>
            <th class="num">Action</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none"></div>
      <div class="pii-note">
        Names &amp; phone numbers are fetched live from Plato for the call list only and are never stored.
      </div>
    </section>
  </div>

  <script>
    let DATA = { summary: {}, patients: [] };
    let view = "worklist";          // "worklist" | "dismissed"
    let tierFilter = null;          // null = the default actionable view
    let clinicianFilter = "";
    let showAll = false;

    async function load() {
      try {
        const res = await fetch("/api/admin/retention", { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        DATA = await res.json();
        renderSummary();
        renderClinicianOptions();
        renderRows();
        document.getElementById("updated").innerHTML =
          '<span class="dot"></span>Updated ' + fmtTime(DATA.generated_at);
        document.getElementById("loading").classList.add("hidden");
      } catch (e) {
        const hint = document.getElementById("loadingHint");
        hint.className = "loading-hint error";
        hint.textContent = "Could not load worklist: " + e.message;
      }
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleString("en-SG", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });
    }
    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "2-digit" });
    }
    function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

    function renderSummary() {
      const s = DATA.summary || {};
      // Red/Orange/Yellow are the "to call" counts, so they sum to Needs follow-up.
      const cards = [
        { tier: "all",    label: "Needs follow-up", value: s.needs_followup || 0, sub: "red + orange + yellow" },
        { tier: "red",    label: "Red",    value: s.red    || 0, sub: "> 4 weeks" },
        { tier: "orange", label: "Orange", value: s.orange || 0, sub: "> 2 weeks" },
        { tier: "yellow", label: "Yellow", value: s.yellow || 0, sub: "> 1 week" },
        { tier: "green",  label: "Green",  value: s.green  || 0, sub: "seen ≤ 1 week" },
        { tier: "booked", label: "Re-booked", value: s.already_booked || 0, sub: "appt scheduled" },
      ];
      const activeTier = (view === "worklist");
      document.getElementById("summary").innerHTML = cards.map(c => {
        const isActive = activeTier && (tierFilter === c.tier || (tierFilter === null && c.tier === "all"));
        const clickable = c.tier !== "booked";
        return `<div class="kpi-card${isActive ? " active" : ""}" data-tier="${c.tier}"
                     ${clickable ? `onclick="setTier('${c.tier}')"` : ""}>
          <div class="kpi-label">${c.label}</div>
          <div class="kpi-value">${c.value}</div>
          <div class="kpi-sub">${c.sub}</div>
        </div>`;
      }).join("");
      document.getElementById("dismissedCount").textContent = s.dismissed || 0;
    }

    function setView(v) {
      view = v;
      document.getElementById("tab-worklist").classList.toggle("active", v === "worklist");
      document.getElementById("tab-dismissed").classList.toggle("active", v === "dismissed");
      document.getElementById("worklistControls").style.display = (v === "worklist") ? "flex" : "none";
      if (v === "dismissed") tierFilter = null;
      renderSummary();
      renderRows();
    }

    function setTier(t) {
      view = "worklist";
      document.getElementById("tab-worklist").classList.add("active");
      document.getElementById("tab-dismissed").classList.remove("active");
      document.getElementById("worklistControls").style.display = "flex";
      if (t === "all") { tierFilter = null; showAll = false; document.getElementById("showAll").checked = false; }
      else { tierFilter = t; }
      renderSummary();
      renderRows();
    }

    function renderClinicianOptions() {
      const ids = [...new Set(DATA.patients.map(p => p.clinician).filter(Boolean))].sort();
      const sel = document.getElementById("clinicianFilter");
      sel.innerHTML = '<option value="">All</option>' + ids.map(c => `<option value="${c}">${c}</option>`).join("");
      sel.value = clinicianFilter;
    }

    function worklistPatients() {
      return DATA.patients.filter(p => {
        if (p.followup_status === "dismissed") return false;   // lives in the Dismissed tab
        if (clinicianFilter && p.clinician !== clinicianFilter) return false;
        if (tierFilter === "green") return p.tier === "green";
        if (tierFilter) return p.tier === tierFilter && p.actionable;
        if (showAll) return true;
        return p.actionable;
      });
    }

    function dismissedPatients() {
      return DATA.patients.filter(p => p.followup_status === "dismissed");
    }

    function renderRows() {
      const list = (view === "dismissed") ? dismissedPatients() : worklistPatients();
      const tbody = document.getElementById("rows");
      const empty = document.getElementById("empty");
      document.getElementById("listTitle").textContent =
        (view === "dismissed") ? "Dismissed patients"
          : tierFilter ? `${cap(tierFilter)} patients`
          : showAll ? "All patients" : "Follow-up worklist";
      if (!list.length) {
        tbody.innerHTML = "";
        empty.textContent = (view === "dismissed")
          ? "No dismissed patients."
          : "Nobody to follow up right now. 🎉";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";
      tbody.innerHTML = list.map(rowHtml).join("");
    }

    function rowHtml(p) {
      const phone = p.phone
        ? `<a class="phone" href="tel:${p.phone.replace(/[^+0-9]/g, '')}">${escapeHtml(p.phone)}</a>`
        : '<span class="muted">—</span>';

      let statusPill = "";
      if (view === "dismissed") statusPill = `<span class="status-pill">Dismissed</span>`;
      else if (p.has_future_appt) statusPill = `<span class="status-pill pill-booked">Booked ${fmtDate(p.next_appt)}</span>`;
      else if (p.followup_status === "contacted") statusPill = `<span class="status-pill">Contacted</span>`;
      else if (p.followup_status === "snoozed") statusPill = `<span class="status-pill">Snoozed → ${fmtDate(p.snooze_until)}</span>`;
      const note = p.followup_note ? `<div class="note">“${escapeHtml(p.followup_note)}”</div>` : "";
      const statusCell = (statusPill || '<span class="muted">—</span>') + note;

      let actions = "";
      if (view === "dismissed") {
        actions = `<div class="actions"><button class="primary" onclick="act('${p.patient_id}','active')">Restore to list</button></div>`;
      } else if (!p.has_future_appt) {
        actions = `<div class="actions">
          <button class="primary" onclick="act('${p.patient_id}','contacted')">Contacted</button>
          <button onclick="act('${p.patient_id}','snoozed')">Snooze</button>
          <button class="danger" onclick="act('${p.patient_id}','dismissed')">Dismiss</button>
        </div>`;
      }

      return `<tr data-id="${p.patient_id}">
        <td><span class="name">${escapeHtml(p.name)}</span> ${p.age_band ? `<span class="muted">· ${p.age_band}</span>` : ""}</td>
        <td>${phone}</td>
        <td>${escapeHtml(p.clinician || "—")}</td>
        <td class="num">${fmtDate(p.last_visit)}</td>
        <td class="num"><span class="tier-badge ${p.tier}">${p.days_since_last}d</span></td>
        <td>${statusCell}</td>
        <td class="num">${actions}</td>
      </tr>`;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Recompute the summary from local state so the cards stay in sync after an
    // action, without a server round-trip. Mirrors fetch_patient_retention.
    function recomputeSummary() {
      const today = new Date().toISOString().slice(0, 10);
      const s = { total: 0, green: 0, yellow: 0, orange: 0, red: 0,
                  needs_followup: 0, already_booked: 0, snoozed: 0, dismissed: 0 };
      for (const p of DATA.patients) {
        s.total++;
        if (p.tier === "green") s.green++;
        if (p.has_future_appt) s.already_booked++;
        if (p.followup_status === "dismissed") s.dismissed++;
        if (p.followup_status === "snoozed" && p.snooze_until && p.snooze_until > today) s.snoozed++;
        if (p.actionable) {
          s.needs_followup++;
          if (p.tier === "red" || p.tier === "orange" || p.tier === "yellow") s[p.tier]++;
        }
      }
      DATA.summary = s;
    }

    function isLapsed(p) { return p.tier === "red" || p.tier === "orange" || p.tier === "yellow"; }

    async function act(patientId, status) {
      const p = DATA.patients.find(x => x.patient_id === patientId);
      if (!p) return;
      let note = null, snoozeDays = null;
      if (status === "dismissed") {
        note = prompt("Dismiss this patient from the worklist. Optional note (e.g. moved overseas, discharged):", "");
        if (note === null) return; // cancelled
      } else if (status === "snoozed") {
        const wks = prompt("Snooze for how many weeks?", "1");
        if (wks === null) return;
        snoozeDays = Math.max(1, parseInt(wks, 10) || 1) * 7;
      }

      // Optimistic local update.
      p.followup_status = status;
      if (status === "snoozed") {
        p.snooze_until = new Date(Date.now() + snoozeDays * 864e5).toISOString().slice(0, 10);
        p.actionable = false;
      } else if (status === "dismissed") {
        p.actionable = false;
      } else if (status === "active") {
        p.snooze_until = null; p.followup_note = null;
        p.actionable = isLapsed(p) && !p.has_future_appt;   // back on the list if still lapsed
      } else if (status === "contacted") {
        p.actionable = !p.has_future_appt;                  // stays on the list, just flagged
      }
      recomputeSummary();
      renderSummary();
      renderRows();

      try {
        const res = await fetch("/api/admin/followup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ patient_id: patientId, status, note, snooze_days: snoozeDays }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
      } catch (e) {
        alert("Could not save (" + e.message + "). Reloading.");
        load();
      }
    }

    document.getElementById("clinicianFilter").addEventListener("change", e => {
      clinicianFilter = e.target.value; renderRows();
    });
    document.getElementById("showAll").addEventListener("change", e => {
      showAll = e.target.checked; if (showAll) tierFilter = null; renderSummary(); renderRows();
    });

    load();
  </script>
</body>
</html>
