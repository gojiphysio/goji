name: Careers form tests

# Tests for business-intelligence/scripts/careers (the job-application backend).
# It deploys by hand (careers/deploy.sh) after a tested go-live, so this only
# tests. It also runs when the site's vacancy list changes, because the backend
# reads the built /careers/vacancies.json.

on:
  pull_request:
    paths:
      - "business-intelligence/scripts/careers/**"
      - "marketing/website/src/lib/vacancies.ts"
      - ".github/workflows/careers-tests.yml"
  push:
    branches: [main]
    paths:
      - "business-intelligence/scripts/careers/**"
      - ".github/workflows/careers-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r business-intelligence/scripts/careers/requirements.txt pytest
      - name: careers tests
        working-directory: business-intelligence/scripts
        run: python -m pytest careers/ -q
