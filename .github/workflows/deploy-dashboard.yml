name: Deploy dashboard

# Auto-deploy the Goji dashboards on every push to main. Tests run first and
# gate the deploy. Auth to Google Cloud uses Workload Identity Federation — no
# service-account key is stored anywhere. One-time setup: see README.md here.
#
# What gets deployed is scoped to what changed in the push:
#   - SQL files               -> redeploy BigQuery views/tables (+ ensure the
#                                 dashboard's write grant on the follow-up table)
#   - patients ingest job     -> redeploy the Cloud Run Job + run it once
#   - dashboard app           -> redeploy BOTH Cloud Run services that run this
#                                 image: goji-dashboard (APP_MODE=dashboard) and
#                                 goji-frontdesk (APP_MODE=frontdesk)

on:
  push:
    branches: [main]
    paths:
      - "business-intelligence/scripts/dashboard/**"
      - "business-intelligence/scripts/sql/**"
      - "business-intelligence/scripts/ingestion/plato_patients/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false   # never interrupt an in-flight deploy

permissions:
  contents: read
  id-token: write             # required for Workload Identity Federation

env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION:  ${{ vars.GCP_REGION }}
  SERVICE: goji-dashboard
  FRONTDESK_SERVICE: goji-frontdesk
  LINKS_SERVICE: goji-links
  LINKS_DOMAIN: go.gojiphysio.com
  DASHBOARD_SA: dashboard-sa@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
  # Click-to-WhatsApp redirect. Public links live at go.gojiphysio.com/<slug>
  # (goji-links service, APP_MODE=links). Set the repo variable WHATSAPP_NUMBER
  # (E.164 digits, no '+') to go live; until then the redirect falls back to the site.
  WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
  WHATSAPP_FALLBACK_URL: ${{ vars.WHATSAPP_FALLBACK_URL || 'https://www.gojiphysio.com' }}
  PLATO_BOOKING_URL: ${{ vars.PLATO_BOOKING_URL }}   # Plato online-booking URL (the 'book' slugs)
  # GA4 BigQuery export dataset (analytics_<propertyId>) for the Website-sessions
  # card. Empty until the repo variable GA4_DATASET is set → the card stays inert.
  GA4_DATASET: ${{ vars.GA4_DATASET }}

jobs:
  # ---- 1. Tests gate the deploy -------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r business-intelligence/scripts/dashboard/requirements.txt pytest
      - name: Dashboard tests
        working-directory: business-intelligence/scripts/dashboard
        run: python -m pytest tests/ -q
      - name: Ingestion tests
        working-directory: business-intelligence/scripts/ingestion/plato_patients
        run: python -m pytest test_extract.py -q

  # ---- 2. Deploy (only after tests pass) ----------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff what changed

      - name: Detect changed areas
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit — deploying everything."
            { echo "sql=true"; echo "patients=true"; echo "dashboard=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "Changed files:"; echo "$changed"
          base_path="business-intelligence/scripts"
          grep -q "^${base_path}/sql/"                      <<<"$changed" && echo "sql=true"       >>"$GITHUB_OUTPUT" || echo "sql=false"       >>"$GITHUB_OUTPUT"
          grep -q "^${base_path}/ingestion/plato_patients/" <<<"$changed" && echo "patients=true"  >>"$GITHUB_OUTPUT" || echo "patients=false"  >>"$GITHUB_OUTPUT"
          grep -q "^${base_path}/dashboard/"                <<<"$changed" && echo "dashboard=true" >>"$GITHUB_OUTPUT" || echo "dashboard=false" >>"$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy SQL views/tables + ensure front-desk write grants
        if: steps.changes.outputs.sql == 'true'
        working-directory: business-intelligence/scripts/sql
        run: |
          ./deploy_all.sh
          # Idempotent: the dashboard SA needs table-level write on the
          # append-only event logs — follow-ups, inbound leads, marketing
          # operating tools, and click-to-WhatsApp link clicks.
          # Everything else stays read-only.
          for t in patient_followup_events lead_events marketing_ops_events link_click_events booking_funnel_events web_session_events; do
            bq add-iam-policy-binding \
              --member="serviceAccount:${DASHBOARD_SA}" \
              --role="roles/bigquery.dataEditor" \
              "${PROJECT}:marts.${t}"
          done

      - name: Deploy + run patients ingest job
        if: steps.changes.outputs.patients == 'true'
        working-directory: business-intelligence/scripts/ingestion/plato_patients
        run: |
          gcloud run jobs deploy plato-patients-ingest \
            --source . --region "${REGION}" --project "${PROJECT}" --quiet
          # Run once so name/phone changes show up immediately (else nightly).
          gcloud run jobs execute plato-patients-ingest \
            --region "${REGION}" --project "${PROJECT}" --wait

      - name: Deploy dashboard
        if: steps.changes.outputs.dashboard == 'true'
        working-directory: business-intelligence/scripts/dashboard
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . --region "${REGION}" --project "${PROJECT}" \
            --service-account "${DASHBOARD_SA}" \
            --set-secrets=DASHBOARD_USER=dashboard-user:latest,DASHBOARD_PASS=dashboard-pass:latest,STAFF_USER=dashboard-staff-user:latest,STAFF_PASS=dashboard-staff-pass:latest \
            --set-env-vars=GCP_PROJECT=${PROJECT},CACHE_TTL_SECONDS=300,APP_MODE=dashboard,WHATSAPP_NUMBER=${WHATSAPP_NUMBER},WHATSAPP_FALLBACK_URL=${WHATSAPP_FALLBACK_URL},PLATO_BOOKING_URL=${PLATO_BOOKING_URL},GA4_DATASET=${GA4_DATASET} \
            --allow-unauthenticated \
            --quiet

      - name: Deploy frontdesk
        if: steps.changes.outputs.dashboard == 'true'
        working-directory: business-intelligence/scripts/dashboard
        run: |
          # Same image as goji-dashboard, but APP_MODE=frontdesk. We deploy from
          # source and deliberately do NOT pass --set-secrets here: the frontdesk
          # service may carry per-person staff logins (STAFF_<N>_USER/PASS) added
          # via deploy_frontdesk.sh, and --set-secrets would drop any not listed.
          # Omitting it lets gcloud carry the existing secret mounts forward.
          # We force APP_MODE=frontdesk on every deploy (via --update-env-vars,
          # which preserves the other env vars) so the front-desk subdomain can
          # never accidentally come up in financial-dashboard mode.
          # NB: the goji-frontdesk service + its frontdesk.gojiphysio.com domain
          # mapping are created once by deploy_frontdesk.sh; this only rolls code.
          # --allow-unauthenticated: the Cloud Run service must accept public
          # requests so they reach Flask, which does the HTTP Basic Auth. Without
          # it the Google front end returns a 403 before the app is ever hit.
          gcloud run deploy "${FRONTDESK_SERVICE}" \
            --source . --region "${REGION}" --project "${PROJECT}" \
            --service-account "${DASHBOARD_SA}" \
            --update-env-vars=APP_MODE=frontdesk \
            --allow-unauthenticated \
            --quiet

      - name: Deploy links (click-to-WhatsApp redirector)
        if: steps.changes.outputs.dashboard == 'true'
        working-directory: business-intelligence/scripts/dashboard
        run: |
          # Public go.gojiphysio.com redirector (APP_MODE=links). `gcloud run
          # deploy` creates the service the first time and updates it after, so
          # there's no manual Cloud Shell step. Full env set so WHATSAPP_NUMBER
          # (from the repo variable) stays in sync on every deploy.
          # --min-instances=1 keeps one container warm: the redirector is a
          # public CTA hop, so a cold start (scale-to-zero + BigQuery client init)
          # added several seconds to the first click after idle — long enough to
          # lose the tap. A single always-on instance is a few $/month and makes
          # every redirect sub-second. 512Mi matches the dashboard image headroom.
          gcloud run deploy "${LINKS_SERVICE}" \
            --source . --region "${REGION}" --project "${PROJECT}" \
            --service-account "${DASHBOARD_SA}" \
            --set-env-vars=GCP_PROJECT=${PROJECT},CACHE_TTL_SECONDS=300,APP_MODE=links,WHATSAPP_NUMBER=${WHATSAPP_NUMBER},WHATSAPP_FALLBACK_URL=${WHATSAPP_FALLBACK_URL},PLATO_BOOKING_URL=${PLATO_BOOKING_URL} \
            --min-instances=1 --memory=512Mi \
            --allow-unauthenticated \
            --quiet
          # Ensure the go.gojiphysio.com domain mapping exists (create once —
          # gojiphysio.com is already domain-verified via the other subdomains).
          # Managed Cloud Run domain-mappings live in the `beta` surface (the GA
          # `gcloud run domain-mappings` is Anthos-only and rejects --region), so
          # install beta non-interactively and pass --quiet. Non-fatal: a mapping
          # hiccup must not fail the rest of the deploy.
          gcloud components install beta --quiet || true
          if gcloud beta run domain-mappings describe --domain="${LINKS_DOMAIN}" \
               --platform=managed --region "${REGION}" --project "${PROJECT}" --quiet >/dev/null 2>&1; then
            echo "domain mapping ${LINKS_DOMAIN} already exists"
          elif gcloud beta run domain-mappings create --service="${LINKS_SERVICE}" \
                 --domain="${LINKS_DOMAIN}" --platform=managed --region "${REGION}" --project "${PROJECT}" --quiet; then
            echo ">> One-time DNS: add  go  CNAME  ghs.googlehosted.com.  on the"
            echo "   gojiphysio.com zone. TLS auto-provisions once it resolves."
          else
            echo "!! Could not create the ${LINKS_DOMAIN} mapping automatically."
            echo "   Create it once with deploy_links.sh, then re-run. Continuing."
          fi
